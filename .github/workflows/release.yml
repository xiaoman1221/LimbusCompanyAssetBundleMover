name: Release Windows x64

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Detect version in commit messages
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -r '.commits[]?.message // empty' "$GITHUB_EVENT_PATH" \
            | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' \
            | tail -n 1 || true)"
          if [ -n "$version" ]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Detected release version: $version"
          else
            echo "No vX.Y.Z version found in commit messages; skipping release."
          fi

      - name: Set up Go
        if: steps.version.outputs.version != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Windows x64
        if: steps.version.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ ! -f rsrc.syso ]; then
            echo "::error::rsrc.syso is missing; the walk manifest would not be embedded."
            exit 1
          fi

          mkdir -p dist
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags "-s -w -H windowsgui" \
            -o "dist/LimbusCompanyAssetBundleMover-${VERSION}-windows-amd64.exe" .

          # Make sure the embedded manifest survived the cross-compilation.
          exe="dist/LimbusCompanyAssetBundleMover-${VERSION}-windows-amd64.exe"
          grep -a -q "Microsoft.Windows.Common-Controls" "$exe" || {
            echo "::error::Common Controls manifest is not embedded in $exe"
            exit 1
          }
          grep -a -q "asInvoker" "$exe" || {
            echo "::error::asInvoker manifest level is not embedded in $exe"
            exit 1
          }

          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          ls -lh

      - name: Upload build artifact
        if: steps.version.outputs.version != ''
        uses: actions/upload-artifact@v4
        with:
          name: LimbusCompanyAssetBundleMover-${{ steps.version.outputs.version }}-windows-amd64
          path: dist/
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.version.outputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Limbus Company AssetBundle Mover ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
